<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title description">
  <title id="title">multi-persona-code-review bounded lanes session</title>
  <desc id="description">A terminal runs four lanes through the bounded review runner: one prints a finding and exits 0, one exits 3, one goes silent, and one keeps printing past its time budget. The runner exits 2 for the last three, and their JSON files record failed, stalled and timed_out.</desc>
  <rect width="1280" height="900" rx="24" fill="#101418" />
  <circle cx="40" cy="44" r="9" fill="#ff6b6b" />
  <circle cx="70" cy="44" r="9" fill="#ffd166" />
  <circle cx="100" cy="44" r="9" fill="#55d6be" />
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">
    <text x="40" y="108" fill="#f7fbff" xml:space="preserve">$ review() { python3 skills/multi-persona-code-review/scripts/run_bounded_review.py --cwd repo --name &quot;$@&quot;; }</text>
    <g class="step-1">
      <text x="40" y="146" fill="#f7fbff" xml:space="preserve">$ review finding --out out/finding.md --json-out out/finding.json -- sh ../agents/finding.sh</text>
      <text x="40" y="170" fill="#55d6be" xml:space="preserve">exit status: 0</text>
    </g>
    <g class="step-2">
      <text x="40" y="208" fill="#f7fbff" xml:space="preserve">$ review failing --out out/failing.md --json-out out/failing.json -- sh -c &#x27;exit 3&#x27;</text>
      <text x="40" y="232" fill="#ffd166" xml:space="preserve">exit status: 2</text>
    </g>
    <g class="step-3">
      <text x="40" y="270" fill="#f7fbff" xml:space="preserve">$ review silent --out out/silent.md --json-out out/silent.json --idle-seconds 1 -- sleep 30</text>
      <text x="40" y="294" fill="#ffd166" xml:space="preserve">exit status: 2</text>
    </g>
    <g class="step-4">
      <text x="40" y="332" fill="#f7fbff" xml:space="preserve">$ review endless --out out/endless.md --json-out out/endless.json --timeout-seconds 2 --idle-seconds 1 -- sh ../agents/endless.sh</text>
      <text x="40" y="356" fill="#ffd166" xml:space="preserve">exit status: 2</text>
    </g>
    <g class="step-5">
      <text x="40" y="394" fill="#f7fbff" xml:space="preserve">$ grep &#x27;&quot;status&quot;&#x27; out/*.json</text>
      <text x="40" y="418" fill="#ffd166" xml:space="preserve">out/endless.json:  &quot;status&quot;: &quot;timed_out&quot;,</text>
      <text x="40" y="442" fill="#ffd166" xml:space="preserve">out/failing.json:  &quot;status&quot;: &quot;failed&quot;,</text>
      <text x="40" y="466" fill="#55d6be" xml:space="preserve">out/finding.json:  &quot;status&quot;: &quot;completed&quot;,</text>
      <text x="40" y="490" fill="#ffd166" xml:space="preserve">out/silent.json:  &quot;status&quot;: &quot;stalled&quot;,</text>
      <text x="40" y="514" fill="#55d6be" xml:space="preserve">exit status: 0</text>
    </g>
    <g class="step-6">
      <text x="40" y="552" fill="#f7fbff" xml:space="preserve">$ sed -n &#x27;/^status:/,/^- severity/p&#x27; out/finding.md</text>
      <text x="40" y="576" fill="#f7fbff" xml:space="preserve">status: findings</text>
      <text x="40" y="600" fill="#f7fbff" xml:space="preserve">findings:</text>
      <text x="40" y="624" fill="#f7fbff" xml:space="preserve">- severity: P2</text>
      <text x="40" y="648" fill="#55d6be" xml:space="preserve">exit status: 0</text>
    </g>
    <g class="step-7">
      <text x="40" y="686" fill="#f7fbff" xml:space="preserve">$ grep -E &#x27;^- (status|cwd|return_code)&#x27; out/silent.md</text>
      <text x="40" y="710" fill="#ffd166" xml:space="preserve">- status: `stalled`</text>
      <text x="40" y="734" fill="#f7fbff" xml:space="preserve">- cwd: `/work/repo`</text>
      <text x="40" y="758" fill="#f7fbff" xml:space="preserve">- return_code: `-15`</text>
      <text x="40" y="782" fill="#55d6be" xml:space="preserve">exit status: 0</text>
    </g>
  </g>
  <text x="40" y="872" fill="#a7bac5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">Reconstructed from evidence/transcripts/bounded-session.txt</text>
</svg>
